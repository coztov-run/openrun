[package]
name = "openrun"
version = "0.1.0"
edition = "2021"
description = "OpenRun — менеджер Windows-программ и префиксов с интерфейсом в стиле GNOME"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
anyhow = "1"
async-channel = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = "2"

[profile.release]
lto = "thin"
strip = true
