name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            appstream desktop-file-utils

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.coztov_run.OpenRun.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/io.github.coztov_run.OpenRun.metainfo.xml
